<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Geoespacial - Módulo 4</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- 1. Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Altura total calculada subtraindo a navbar de 56px */
    #map {
      height: calc(100vh - 56px);
      width: 100%;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="#">SIGWeb Municipal</a>
    <!-- CORREÇÃO 1: ID alterado para status-feicoes para o JS conseguir encontrar -->
    <span class="badge bg-success" id="status-feicoes">Clique no mapa para inspecionar</span>
  </nav>

  <div class="container-fluid p-0">
    <div class="row g-0">

      <!-- Painel Lateral -->
      <aside class="col-md-3 bg-white p-3 border-end shadow-sm" style="height: calc(100vh - 56px); overflow-y: auto;">
        <h5 class="text-secondary border-bottom pb-2">Camadas Espaciais</h5>

        <p class="small text-muted">Selecione para alternar a exibição:</p>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-success btn-sm" id="btn-zoom-poligono">🔍 Enquadrar Estados do Brasil</button>
          <button class="btn btn-outline-danger btn-sm" id="btn-carregar-api">⚡ Atualizar API de Sismos (USGS)</button>
        </div>

        <div class="card mt-4 border-success">
          <div class="card-body p-2">
            <h6 class="card-title text-success mb-1" style="font-size: 0.85rem;">Legenda Temática</h6>
            <p class="card-text text-muted" style="font-size: 0.75rem;">
              🟩 Verde: Estados do Brasil (Polígono)<br>
              🔴 Círculos Vermelhos: Sismos M2.5+ nas últimas 24h (API USGS)
            </p>
          </div>
        </div>
      </aside>

      <!-- Área do Mapa Real -->
      <main class="col-md-9 p-0">
        <div id="map"></div>
      </main>

    </div>
  </div>

  <!-- 2. Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 3. Lógica JavaScript de Inicialização -->
  <script>
    // Coordenadas iniciais (exemplo: Belém/PA)
    const centroLat = -1.4558;
    const centroLng = -48.4902;
    const zoomInicial = 6;

    // Inicializa o mapa na div com id="map"
    const map = L.map('map').setView([centroLat, centroLng], zoomInicial);

    // Adiciona a camada de mapa base (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
      referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    const statusBadge = document.getElementById('status-feicoes');

    // 2. Dado GeoJSON Local (Polígono de exemplo)
    const dadosPoligonoLocal = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "nome": "Parque Estadual do Utinga",
            "categoria": "Proteção Integral",
            "area_ha": 1393
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[
              [-48.442, -1.415],
              [-48.405, -1.415],
              [-48.405, -1.445],
              [-48.442, -1.445],
              [-48.442, -1.415]
            ]]
          }
        }
      ]
    };

    // 3. Renderiza o GeoJSON local aplicando estilo e popup temático
    // const camadaPoligono = L.geoJSON(dadosPoligonoLocal, {
    //   style: function (feature) {
    //     return {
    //       color: "#16a34a",
    //       weight: 2,
    //       fillColor: "#22c55e",
    //       fillOpacity: 0.4
    //     };
    //   },
    //   onEachFeature: function (feature, layer) {
    //     layer.bindPopup(`
    //       <h6 class="mb-1">${feature.properties.nome}</h6>
    //       <small><b>Categoria:</b> ${feature.properties.categoria}<br>
    //       <b>Área:</b> ${feature.properties.area_ha} hectares</small>
    //     `);
    //   }
    // }).addTo(map);

    let camadaEstados;
    fetch('meusDados2.geojson')
      .then(resposta => resposta.json())
      .then(dados => {
        // 2. O Leaflet converte o GeoJSON em feições visuais 
        camadaEstados = L.geoJSON(dados, {
          style: {
            // return {
              color: "#16a34a",
              weight: 2,
              fillColor: "#22c55e",
              fillOpacity: 0.4
            // };
          },
          onEachFeature: function (feature, layer) {
            layer.bindPopup(`
              <h6 class="mb-1"> ${feature.properties.NM_UF }</h6 >
              <small><b>Região:</b> ${feature.properties.NM_REGIA}<br>
              <b>Área:</b> ${feature.properties.AREA_KM2} Km2</small>
            `);}
        }).addTo(map);
        // 3. Ajusta o enquadramento do mapa para a extensão dos dados 
        map.fitBounds(camadaEstados.getBounds());
      });

    // map.fitBounds(camadaEstados.getBounds());
    statusBadge.textContent = "Camada Estados carregada!";

    // 4. Consumo de API Externa em Tempo Real (USGS Earthquakes)
    let camadaSismos;
    function carregarDadosAPI() {
      statusBadge.textContent = "Consultando API USGS...";
      statusBadge.className = "badge bg-warning";

      fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson')
        .then(res => res.json())
        .then(dados => {
          if (camadaSismos) map.removeLayer(camadaSismos);

          camadaSismos = L.geoJSON(dados, {
            pointToLayer: function (feature, latlng) {
              return L.circleMarker(latlng, {
                // CORREÇÃO 3: Sintaxe matemática de multiplicação corrigida
                radius: feature.properties.mag * 2,
                fillColor: "#ef4444",
                color: "#991b1b",
                weight: 1,
                fillOpacity: 0.7
              });
            },
            onEachFeature: function (feature, layer) {
              layer.bindPopup(`
                <b>Magnitude:</b> ${feature.properties.mag}<br>
                <b>Local:</b> ${feature.properties.place}<br>
                <small>${new Date(feature.properties.time).toLocaleString()}</small>
              `);
            }
          }).addTo(map);

          statusBadge.textContent = `API Ativa: ${dados.features.length} eventos globais`;
          statusBadge.className = "badge bg-success";
        })
        .catch(err => {
          statusBadge.textContent = "Erro ao conectar à API";
          statusBadge.className = "badge bg-danger";
          console.error(err);
        });
    }

    // Botões de Interação
    document.getElementById('btn-zoom-poligono').addEventListener('click', () => {
      map.fitBounds(camadaEstados.getBounds());
    });

    document.getElementById('btn-carregar-api').addEventListener('click', carregarDadosAPI);
  </script>
</body>

</html>
