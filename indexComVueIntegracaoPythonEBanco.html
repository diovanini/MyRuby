<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Geoespacial - Módulo 7 (PostGIS & Vue.js)</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Altura total descontando os 56px da navbar */
    #map {
      height: calc(100vh - 56px);
      width: 100%;
    }
  </style>
</head>

<body class="bg-light">

  <!-- AQUI O VUE ASSUME O CONTROLE DA INTERFACE (#app) -->
  <div id="app">
    
    <!-- Barra Superior Reativa -->
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand fw-bold" href="#">🗺️ {{ tituloSistema }}</a>
      <span :class="['badge', statusClasse]">{{ statusTexto }}</span>
    </nav>

    <div class="container-fluid p-0">
      <div class="row g-0">

        <!-- Painel Lateral -->
        <aside class="col-md-3 bg-white p-3 border-end shadow-sm" style="height: calc(100vh - 56px); overflow-y: auto;">
          <h5 class="text-secondary border-bottom pb-2">Camadas Espaciais</h5>

          <p class="small text-muted">Ações disponíveis no visualizador:</p>
          <div class="d-grid gap-2">
            <!-- Eventos do Vue com @click chamando os métodos -->
            <button class="btn btn-outline-success btn-sm" @click="enquadrarEstados">
              🔍 Enquadrar Estados (PostGIS)
            </button>
            <button class="btn btn-outline-danger btn-sm" @click="carregarSismosAPI">
              ⚡ Atualizar API de Sismos (USGS)
            </button>
          </div>

          <!-- Card Informativo Reativo -->
          <div class="card mt-4 border-success">
            <div class="card-body p-2">
              <h6 class="card-title text-success mb-1" style="font-size: 0.85rem;">Status das Camadas</h6>
              <p class="card-text text-muted mb-0" style="font-size: 0.75rem;">
                🟩 <b>Estados (PostGIS):</b> {{ totalEstados }} feições<br>
                🔴 <b>Sismos (USGS API):</b> {{ totalSismos }} eventos ativos
              </p>
            </div>
          </div>

          <div class="card mt-3 border-info">
            <div class="card-body p-2">
              <h6 class="card-title text-info mb-1" style="font-size: 0.85rem;">Conexão Back-End</h6>
              <p class="card-text text-muted mb-0" style="font-size: 0.75rem;">
                API: Python / Flask<br>
                Banco: PostgreSQL 16 + PostGIS 3.4
              </p>
            </div>
          </div>
        </aside>

        <!-- Área Nobre do Mapa -->
        <main class="col-md-9 p-0">
          <div id="map"></div>
        </main>

      </div>
    </div>

  </div>

  <!-- 1. Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 2. Vue 3 via CDN (Global Build) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- 3. Lógica Reativa Vue Integrada ao Leaflet -->
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          tituloSistema: "SIGWeb Municipal & PostGIS",
          statusTexto: "Inicializando visualizador...",
          statusClasse: "bg-secondary",
          totalEstados: 0,
          totalSismos: 0,
          mapa: null,
          camadaEstados: null,
          camadaSismos: null
        };
      },
      mounted() {
        // Inicializa o mapa com centro em Belém/PA e zoom 6
        this.mapa = L.map('map').setView([-1.4558, -48.4902], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(this.mapa);

        // Dispara o carregamento vindo do banco assim que a página abre
        this.carregarEstadosDoPostgis();
      },
      methods: {
        async carregarEstadosDoPostgis() {
          this.statusTexto = "Buscando dados no PostGIS...";
          this.statusClasse = "bg-warning text-dark";

          try {
            // Requisita o endpoint em Python no localhost
            const resposta = await fetch('http://127.0.0.1:5000/api/estados');
            const dadosGeoJSON = await resposta.json();

            // Renderiza as feições no Leaflet
            this.camadaEstados = L.geoJSON(dadosGeoJSON, {
              style: {
                color: "#16a34a",
                weight: 2,
                fillColor: "#22c55e",
                fillOpacity: 0.35
              },
              onEachFeature: (feature, layer) => {
                const props = feature.properties;
                layer.bindPopup(`
                  <h6 class="mb-1 text-success">${props.NM_UF || 'Sem Nome'}</h6>
                  <small>
                    <b>Região:</b> ${props.NM_REGIA || 'N/I'}<br>
                    <b>Área:</b> ${props.AREA_KM2 ? Number(props.AREA_KM2).toLocaleString('pt-BR') : 'N/I'} km²
                  </small>
                `);
              }
            }).addTo(this.mapa);

            // Atualiza os estados reativos do Vue
            this.totalEstados = dadosGeoJSON.features ? dadosGeoJSON.features.length : 0;
            this.statusTexto = `PostGIS Conectado (${this.totalEstados} estados)`;
            this.statusClasse = "bg-success";

            // Enquadra a visão do mapa nos limites da camada
            if (this.totalEstados > 0) {
              this.mapa.fitBounds(this.camadaEstados.getBounds());
            }

          } catch (erro) {
            console.error("Erro ao carregar do PostGIS:", erro);
            this.statusTexto = "Erro na API PostGIS (Verifique o Flask)";
            this.statusClasse = "bg-danger";
          }
        },

        enquadrarEstados() {
          if (this.camadaEstados) {
            this.mapa.fitBounds(this.camadaEstados.getBounds());
          }
        },

        async carregarSismosAPI() {
          this.statusTexto = "Consultando API USGS...";
          this.statusClasse = "bg-warning text-dark";

          try {
            const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
            const dados = await res.json();

            if (this.camadaSismos) {
              this.mapa.removeLayer(this.camadaSismos);
            }

            this.camadaSismos = L.geoJSON(dados, {
              pointToLayer: (feature, latlng) => {
                return L.circleMarker(latlng, {
                  radius: feature.properties.mag * 2,
                  fillColor: "#ef4444",
                  color: "#991b1b",
                  weight: 1,
                  fillOpacity: 0.7
                });
              },
              onEachFeature: (feature, layer) => {
                layer.bindPopup(`
                  <b>Magnitude:</b> ${feature.properties.mag}<br>
                  <b>Local:</b> ${feature.properties.place}<br>
                  <small>${new Date(feature.properties.time).toLocaleString()}</small>
                `);
              }
            }).addTo(this.mapa);

            this.totalSismos = dados.features.length;
            this.statusTexto = `API USGS Atualizada (${this.totalSismos} eventos)`;
            this.statusClasse = "bg-success";

          } catch (erro) {
            console.error("Erro ao consultar USGS:", erro);
            this.statusTexto = "Falha ao consultar API externa";
            this.statusClasse = "bg-danger";
          }
        }
      }
    }).mount('#app');
  </script>
</body>

</html>
